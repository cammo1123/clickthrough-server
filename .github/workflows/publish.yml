name: Build & Publish

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release tag to publish, for example v0.0.3
                required: true
                type: string
            changelog:
                description: Release notes to publish
                required: true
                type: string
            minecraft_profile:
                description: Minecraft build profile from gradle/versions
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  cache-read-only: ${{ github.ref_type != 'tag' }}

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Validate Minecraft profiles
              env:
                  MINECRAFT_PROFILE: ${{ inputs.minecraft_profile }}
              run: |
                  case "$MINECRAFT_PROFILE" in
                      ''|*[!A-Za-z0-9._-]*)
                          echo "::error::Invalid Minecraft profile: $MINECRAFT_PROFILE"
                          exit 1
                          ;;
                  esac
                  if [ ! -f "gradle/versions/$MINECRAFT_PROFILE.properties" ]; then
                      echo "::error::Unknown Minecraft profile: $MINECRAFT_PROFILE"
                      exit 1
                  fi
                  ./gradlew validateProfiles --no-daemon -Pmc_target="$MINECRAFT_PROFILE"

            - name: Build
              env:
                  MINECRAFT_PROFILE: ${{ inputs.minecraft_profile }}
              run: ./gradlew build --no-daemon -Pmc_target="$MINECRAFT_PROFILE"

            - name: Stage build artifacts
              id: jars
              run: |
                  mkdir -p dist
                  # Collect every built jar that carries a loader metadata file.
                  # A new loader module (e.g. quilt) is picked up automatically.
                  for jar in $(find . -type f -path '*/build/libs/*.jar' \
                      ! -name '*-sources.jar' ! -name '*-dev.jar'); do
                      if unzip -l "$jar" 2>/dev/null | grep -qE \
                          'fabric\.mod\.json|quilt\.mod\.json|META-INF/((neo)?forge\.mods\.toml|mods\.toml)'; then
                          cp "$jar" dist/
                      fi
                  done
                  ls -la dist

                  # Map each jar to its loader id. Jar names come from the
                  # per-module Gradle archivesName (base_name + module), so map
                  # explicitly to keep loader ids stable even if a module name
                  # contains hyphens.
                  loaders=""
                  for jar in $(find dist -maxdepth 1 -type f -name 'clickthrough_server-*.jar'); do
                      case "$jar" in
                          *-fabric-*)   loader="fabric" ;;
                          *-neoforge-*) loader="neoforge" ;;
                          *-forge-*)    loader="forge" ;;
                          *-quilt-*)    loader="quilt" ;;
                          *)
                              echo "::error::Unrecognized loader in jar name: $jar"
                              exit 1
                              ;;
                      esac
                      loaders="$loaders,\"$loader\""
                  done

                  if [ -z "$loaders" ]; then
                    echo "::error::No publishable loader jars found"
                    exit 1
                  fi

                  loaders_json="[${loaders#?}]"
                  echo "loaders=$loaders_json" >> "$GITHUB_OUTPUT"
                  echo "Detected loaders: $loaders_json"

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: clickthrough_server-jars
                  path: dist
                  if-no-files-found: error

        outputs:
            loaders: ${{ steps.jars.outputs.loaders }}

    publish:
        name: Publish ${{ matrix.loader }}
        needs: build
        runs-on: ubuntu-latest
        strategy:
            # Serialize the matrix: every loader publishes into the same GitHub
            # release for a tag, so concurrent runs would race on that release.
            max-parallel: 1
            matrix:
                loader: ${{ fromJson(needs.build.outputs.loaders) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: clickthrough_server-jars
                  path: dist

            - name: Use manual changelog
              id: manual_changelog
              env:
                  CHANGELOG: ${{ inputs.changelog }}
              run: |
                  echo "content<<EOF" >> "$GITHUB_OUTPUT"
                  printf '%s\n' "$CHANGELOG" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Publish mod
              uses: Kir-Antipov/mc-publish@v3.3
              with:
                  # --- Modrinth ---
                  modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
                  modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
                  modrinth-featured: true

                  # --- GitHub Releases ---
                  github-tag: ${{ inputs.version || github.ref_name }}
                  github-generate-changelog: false
                  github-token: ${{ secrets.GITHUB_TOKEN }}

                  # --- Shared metadata ---
                  # Loaders, game versions and dependencies are read from the
                  # jar's own metadata (fabric.mod.json / neoforge.mods.toml),
                  # so MC or loader bumps need no workflow changes.
                  files: dist/clickthrough_server-${{ matrix.loader }}-*.jar
                  name: "${{ github.event.repository.name }} ${{ inputs.version || github.ref_name }}"
                  version: ${{ inputs.version || github.ref_name }}
                  version-type: ${{ contains(inputs.version || github.ref_name, 'alpha') && 'alpha' || (contains(inputs.version || github.ref_name, 'beta') && 'beta' || 'release') }}
                  changelog: ${{ steps.manual_changelog.outputs.content }}
