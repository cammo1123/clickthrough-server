plugins {
	id 'base'
}

group = project.maven_group
version = project.version

subprojects {
	group = rootProject.group
	version = rootProject.version

	plugins.withId('java') {
		java {
			sourceCompatibility = JavaVersion.VERSION_25
			targetCompatibility = JavaVersion.VERSION_25
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = 25
		}

		processResources {
			inputs.property "version", project.version
			inputs.property "group", project.group
			inputs.property "minecraft_supported_versions", project.minecraft_supported_versions
			inputs.property "minecraft_dependency_range", project.minecraft_dependency_range
			if (project.findProperty('loader_version')) {
				inputs.property "loader_version", project.loader_version
				filesMatching("fabric.mod.json") {
					expand "version": project.version,
						"minecraft_supported_versions": project.minecraft_supported_versions,
						"loader_version": project.loader_version
				}
			}
			if (project.findProperty('quilt_loader_version')) {
				inputs.property "quilt_loader_version", project.quilt_loader_version
				filesMatching("quilt.mod.json") {
					expand "version": project.version,
						"group": project.group,
						"minecraft_supported_versions": project.minecraft_supported_versions,
						"quilt_loader_version": project.quilt_loader_version
				}
			}
			filesMatching("META-INF/neoforge.mods.toml") {
				expand "version": project.version,
					"minecraft_dependency_range": project.minecraft_dependency_range,
					"neoforge_dependency_range": project.neoforge_dependency_range
			}
		}
	}

	plugins.withId('maven-publish') {
		tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
			archiveFileName = providers.provider {
				"${archiveBaseName.get()}-${archiveVersion.get()}-${project.minecraft_version}.${archiveExtension.get()}"
			}
		}

		jar {
			from(project(':common').sourceSets.main.output)
			from(rootProject.file('LICENSE')) {
				rename { "${it}_${project.base_name}" }
			}
		}

		java {
			withSourcesJar()
		}

		sourcesJar {
			from(project(':common').sourceSets.main.allSource)
		}

		publishing {
			publications {
				create('mavenJava', MavenPublication) {
					artifactId = "${project.base_name}-${project.name}"
					from components.java
				}
			}
		}
	}
}
